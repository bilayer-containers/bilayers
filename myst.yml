  nav:
    - title: User Guide
      url: /user-guide
    - title: Developer Guide
      url: /developer-guide
    - title: Architecture
      url: /overview
    - title: Testing Guide
      url: /testing
    - title: Versioning Guide
      url: /versioning
    - title: FAQ
      url: /faq
    - title: Talks & Tutorials
      url: /talks-tutorials
  options:
    favicon: docs/images/standard/favicon.ico
    logo: docs/images/standard/Bilayers_Logo.png
    logo_text: Bilayers
    hide_toc: false
    outline_maxdepth: 3
    hide_outline: false
